spring:
  application:
    name: raymoore-xyz
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    default-schema: public
    schemas: public,madisonsc
    # One-time production attachment setting. Return to false after Flyway records baseline 0 and applies V1.
    baseline-on-migrate: true
    baseline-version: "0"
  sql:
    init:
      mode: never

app:
  api-secret: ${API_SECRET}
